# Sat Sep 12 04:01:39 UTC 2026
micronaut.application.name=backend-prueba
micronaut.server.port=8081

# ---- Swagger / OpenAPI ----
micronaut.router.static-resources.swagger.paths=classpath:META-INF/swagger
micronaut.router.static-resources.swagger.mapping=/swagger/**
micronaut.router.static-resources.swagger-ui.paths=classpath:META-INF/swagger/views/swagger-ui
micronaut.router.static-resources.swagger-ui.mapping=/swagger-ui/**

# ---- Seguridad ----
micronaut.security.authentication=bearer

# JWKS de Keycloak (ÚNICO mecanismo de validación)
micronaut.security.token.jwt.signatures.jwks.keycloak.url=http://localhost:8080/realms/COREBANCARIO/protocol/openid-connect/certs

# ---- Reglas de acceso ----
micronaut.security.intercept-url-map[0].pattern=/swagger-ui/**
micronaut.security.intercept-url-map[0].access=isAnonymous()
micronaut.security.intercept-url-map[1].pattern=/swagger/**
micronaut.security.intercept-url-map[1].access=isAnonymous()


micronaut.server.cors.enabled=true
micronaut.server.cors.configurations.web.allowed-origins[0]=http://localhost:4200
micronaut.server.cors.configurations.web.allowed-methods[0]=GET
micronaut.server.cors.configurations.web.allowed-methods[1]=POST
micronaut.server.cors.configurations.web.allowed-methods[2]=PUT
micronaut.server.cors.configurations.web.allowed-methods[3]=DELETE
micronaut.server.cors.configurations.web.allowed-methods[4]=OPTIONS
micronaut.server.cors.configurations.web.allowed-headers[0]=Content-Type
micronaut.server.cors.configurations.web.allowed-headers[1]=Authorization
micronaut.server.cors.configurations.web.allow-credentials=true

# Habilitar logs de acceso HTTP
logger.levels.io.micronaut.http.server.netty=DEBUG
logger.levels.io.micronaut.http.server=DEBUG
logger.levels.io.micronaut.web.router=DEBUG